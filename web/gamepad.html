<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"><title>ReaGBA - Gamepad bindings</title><link rel="stylesheet" href="style.css"></head>
<body class="gamepad-window">
<header><h1 data-i18n="gamepadTitle">Gamepad bindings</h1><button id="close-gamepad-settings" class="small" data-i18n="closeSettings">Close settings</button></header>
<main>
  <p class="hint" data-i18n="gamepadHint">Click a binding, then press a gamepad button. Changes are saved automatically. Press Esc to cancel.</p>
  <div class="gamepad-capture"><p id="gamepad-status" class="hint" role="status" aria-live="polite"></p><button id="cancel-gamepad-capture" class="small" data-i18n="gamepadCancel" hidden>Cancel</button></div>
  <div id="gamepad-bindings" class="gamepad-grid" hidden></div><button id="reset-gamepad" class="small" data-i18n="resetGamepad" disabled>Reset gamepad bindings</button>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="i18n.js"></script><script src="bridge.js"></script><script src="gamepad.js"></script>
</body></html>
