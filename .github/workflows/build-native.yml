name: Build ReaGBA

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            os: macos-14
            arch: arm64
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libx11-dev libgtk-3-dev libwebkit2gtk-4.1-dev libepoxy-dev libasound2-dev libudev-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      - name: Configure macOS
        if: runner.os == 'macOS'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: >-
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Stage installation
        run: cmake --install build/native --config Release --component ReaGBA --prefix build/package
      - name: Create installation archive
        run: python scripts/release.py --stage build/package --platform ${{ matrix.name }} --output build/artifact
      - uses: actions/upload-artifact@v6
        with:
          name: reagba-${{ matrix.name }}
          path: build/artifact/*
          if-no-files-found: error

  release:
    name: Publish versioned release files
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    # Serialize publication only; builds still run in parallel. Re-read release
    # state inside this job so simultaneous pushes cannot replace one version.
    concurrency:
      group: reagba-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read CMake version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py --plan
      - uses: actions/download-artifact@v7
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: reagba-*
          path: build/artifacts
          merge-multiple: true
      - name: Assemble install archives and public ReaPack publishing bundle
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release.py --artifacts build/artifacts --output dist --tag "$RELEASE_TAG"
      - name: Publish all files and the matching version tag
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py --publish dist
